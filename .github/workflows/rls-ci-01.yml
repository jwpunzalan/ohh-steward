name: RLS-CI-01

# Hard gate per DIP-2.1 (Implementation Instructions item 9 / Deployment
# Instructions item 2): runs the tenant-isolation regression suite against an
# ephemeral local Supabase CLI stack. Configured as a required branch-
# protection status check on dev and main, so it runs on every PR regardless
# of which files changed (no path filter) — a required check that never
# reports on some PRs would leave those PRs permanently blocked, since GitHub
# treats a required check that never runs as pending, not passed. Never
# targets a real Preview/Production project — see Secure Coding obligation 4
# note below.
on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rls-ci-01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.84.2"

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack (applies supabase/migrations automatically)
        run: supabase start

      - name: Export local Supabase connection env vars
        # These are the Supabase CLI's well-known local-dev demo keys, printed
        # by `supabase start`/`supabase status` for every local project — not
        # a real credential (Secure Coding obligation 4). Never substitute a
        # real Preview/Production key here.
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run RLS-CI-01
        run: npm run test:rls

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
